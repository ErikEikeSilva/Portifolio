<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#61dafb;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:transparent;stop-opacity:0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="800" height="320" fill="url(#bg)"/>
  <rect width="800" height="320" fill="url(#glow)"/>
  
  <!-- Grid lines subtle -->
  <g opacity="0.05" stroke="#61dafb" stroke-width="0.5">
    <line x1="0" y1="64" x2="800" y2="64"/>
    <line x1="0" y1="128" x2="800" y2="128"/>
    <line x1="0" y1="192" x2="800" y2="192"/>
    <line x1="0" y1="256" x2="800" y2="256"/>
    <line x1="160" y1="0" x2="160" y2="320"/>
    <line x1="320" y1="0" x2="320" y2="320"/>
    <line x1="480" y1="0" x2="480" y2="320"/>
    <line x1="640" y1="0" x2="640" y2="320"/>
  </g>

  <!-- React atom icon centered -->
  <!-- Nucleus -->
  <circle cx="400" cy="160" r="18" fill="#61dafb" opacity="0.9"/>
  <circle cx="400" cy="160" r="10" fill="#0f172a"/>
  <circle cx="400" cy="160" r="6" fill="#61dafb"/>

  <!-- Orbit 1 -->
  <ellipse cx="400" cy="160" rx="90" ry="32" fill="none" stroke="#61dafb" stroke-width="2.5" opacity="0.8"/>
  <!-- Orbit 2 rotated 60deg -->
  <ellipse cx="400" cy="160" rx="90" ry="32" fill="none" stroke="#61dafb" stroke-width="2.5" opacity="0.8" transform="rotate(60 400 160)"/>
  <!-- Orbit 3 rotated 120deg -->
  <ellipse cx="400" cy="160" rx="90" ry="32" fill="none" stroke="#61dafb" stroke-width="2.5" opacity="0.8" transform="rotate(120 400 160)"/>

  <!-- Orbiting dots -->
  <circle cx="490" cy="160" r="5" fill="#61dafb"/>
  <circle cx="355" cy="238" r="5" fill="#61dafb"/>
  <circle cx="355" cy="82" r="5" fill="#61dafb"/>

  <!-- Glow behind atom -->
  <circle cx="400" cy="160" r="110" fill="#61dafb" opacity="0.04" filter="url(#blur)"/>

  <!-- Text -->
  <text x="400" y="290" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#61dafb" opacity="0.7" letter-spacing="4">JAVASCRIPT · REACT</text>
  <text x="400" y="40" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="22" font-weight="700" fill="#e8edf8" opacity="0.9">Front-end Development</text>

  <!-- Code snippets decorative left -->
  <text x="60" y="120" font-family="JetBrains Mono, monospace" font-size="11" fill="#61dafb" opacity="0.3">const App = () =&gt; {</text>
  <text x="60" y="138" font-family="JetBrains Mono, monospace" font-size="11" fill="#a78bfa" opacity="0.3">  return &lt;App /&gt;</text>
  <text x="60" y="156" font-family="JetBrains Mono, monospace" font-size="11" fill="#61dafb" opacity="0.3">}</text>

  <!-- Code snippets decorative right -->
  <text x="580" y="190" font-family="JetBrains Mono, monospace" font-size="11" fill="#4ade80" opacity="0.3">useState()</text>
  <text x="580" y="208" font-family="JetBrains Mono, monospace" font-size="11" fill="#fb923c" opacity="0.3">useEffect()</text>
  <text x="580" y="226" font-family="JetBrains Mono, monospace" font-size="11" fill="#61dafb" opacity="0.3">useContext()</text>
</svg>
